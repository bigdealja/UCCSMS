# Production overlay: source the most sensitive values from Docker secrets (files) instead of
# the .env file. Run with:  docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# The API reads /run/secrets/* via .NET's KeyPerFile provider, so a secret file named
# "ConnectionStrings__Sms" (or "Auth__Audience", etc.) overrides that configuration key.
# Create the secret files first (git-ignored):
#   mkdir -p secrets
#   printf 'Server=db,1433;Database=SMS;User Id=sa;Password=...;TrustServerCertificate=True' > secrets/ConnectionStrings__Sms
#   printf '...' > secrets/Storage__S3__SecretKey
#   printf '...' > secrets/Ai__ApiKey
secrets:
  ConnectionStrings__Sms: { file: ./secrets/ConnectionStrings__Sms }
  Storage__S3__SecretKey: { file: ./secrets/Storage__S3__SecretKey }
  Ai__ApiKey:             { file: ./secrets/Ai__ApiKey }

services:
  api:
    secrets:
      - ConnectionStrings__Sms   # overrides SMS_DB / ConnectionStrings:Sms from the env
      - Storage__S3__SecretKey
      - Ai__ApiKey
