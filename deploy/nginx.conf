# Single entry point. Serves the SPA and reverse-proxies the API.
# Add a `listen 443 ssl;` server block with your certs for production TLS.
server {
    listen 80;
    server_name _;

    # API
    location /api/    { proxy_pass http://api:8080/api/;    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location /health  { proxy_pass http://api:8080/health; }
    location /swagger { proxy_pass http://api:8080/swagger; }

    # SPA (static files, client-side routing fallback)
    location / { proxy_pass http://web:80/; proxy_set_header Host $host; }
}
