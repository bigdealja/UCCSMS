# Single internet-facing entry point: serves the SPA and reverse-proxies the API.
# TLS terminates here; the API and web containers are only reachable on the internal network.

# ---- Shared proxy + security settings ----
# (included into the HTTPS server; HSTS is only emitted over TLS)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Redirect all plain HTTP to HTTPS (except the ACME challenge used by Let's Encrypt).
server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 challenge (certbot writes here); served over HTTP by design.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ---- TLS ----
    # Point these at your certificate + key. For a quick start use deploy/gen-selfsigned-cert.sh;
    # for production use a CA-issued cert (Let's Encrypt or your institution's PKI).
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- Security headers ----
    # HSTS: force HTTPS for a year (add ;preload once you're certain and submitted to the list).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP: SPA + same-origin API. Tighten 'unsafe-inline' once the build emits nonces/hashes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Don't advertise the nginx version.
    server_tokens off;

    # Upload ceiling for document management (matches the API's own limit).
    client_max_body_size 50m;

    # ---- API ----
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location /health  { proxy_pass http://api:8080/health; proxy_set_header Host $host; }

    # Swagger is useful internally but should not be exposed publicly in production.
    # Uncomment to serve it, or keep it closed and reach it over the internal network.
    # location /swagger { proxy_pass http://api:8080/swagger; proxy_set_header Host $host; }

    # ---- SPA (static files, client-side routing fallback) ----
    location / {
        proxy_pass http://web:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
