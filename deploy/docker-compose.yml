# On-premises deployment for the Student Management System.
# Runs entirely on your own servers; nginx is the single internet-facing entry point (add TLS).
# NOTE: every secret below is read from deploy/.env — never commit real values.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_SA_PASSWORD}"
    volumes: [ "mssql-data:/var/opt/mssql" ]
    # Not published to the host in production — only the API talks to it on the internal network.

  auth:
    image: quay.io/keycloak/keycloak:25.0
    command: start --hostname-strict=false --http-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      KC_DB: mssql
      KC_DB_URL: "jdbc:sqlserver://db:1433;databaseName=Keycloak;encrypt=true;trustServerCertificate=true"
      KC_DB_USERNAME: sa
      KC_DB_PASSWORD: "${DB_SA_PASSWORD}"
    depends_on: [ db ]

  storage:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes: [ "minio-data:/data" ]

  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      SMS_DB: "Server=db,1433;Database=SMS;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True"
      Auth__Authority: "${AUTH_AUTHORITY}"
      Auth__Audience: "sms-api"
      Cors__Origins__0: "${PUBLIC_URL}"
      Moodle__BaseUrl: "${MOODLE_URL}"
      Moodle__Token: "${MOODLE_TOKEN}"
      Storage__Provider: "S3"
      Storage__S3__Endpoint: "http://storage:9000"
      Storage__S3__Bucket: "documents"
      Storage__S3__AccessKey: "${MINIO_ROOT_USER}"
      Storage__S3__SecretKey: "${MINIO_ROOT_PASSWORD}"
      Storage__S3__ForcePathStyle: "true"
      Accounting__Provider: "${ACCOUNTING_PROVIDER:-None}"
      Accounting__Sage300__BaseUrl: "${SAGE_BASEURL:-}"
      Accounting__Sage300__Company: "${SAGE_COMPANY:-}"
      Accounting__Sage300__Username: "${SAGE_USER:-}"
      Accounting__Sage300__Password: "${SAGE_PASSWORD:-}"
      Crm__Provider: "${CRM_PROVIDER:-BuiltIn}"
      Crm__CaptureSecret: "${CRM_CAPTURE_SECRET:-}"
      Crm__Webhook__Url: "${CRM_WEBHOOK_URL:-}"
      Ai__Provider: "${AI_PROVIDER:-None}"
      Ai__Enabled: "${AI_ENABLED:-false}"
      Ai__BaseUrl: "${AI_BASEURL:-}"
      Ai__Model: "${AI_MODEL:-}"
    depends_on: [ db, auth ]

  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    depends_on: [ api ]

  proxy:
    image: nginx:1.27-alpine
    ports: [ "80:80", "443:443" ]   # the only ports exposed to the network
    volumes:
      - "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      # - "./certs:/etc/nginx/certs:ro"   # mount your TLS cert/key here
    depends_on: [ api, web ]

volumes:
  mssql-data:
  minio-data:
