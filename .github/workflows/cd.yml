name: CD

# Build and publish container images on every push to main and on version tags,
# then (optionally) deploy to the on-premises server.
on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to the on-prem server after building'
        type: boolean
        default: false

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to GitHub Container Registry
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: deploy/Dockerfile.api
          - name: web
            dockerfile: deploy/Dockerfile.web
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to on-prem
    needs: images
    runs-on: ubuntu-latest
    # Requires a GitHub Environment named "production" — add required reviewers there to gate
    # deploys behind manual approval. Runs on main pushes / tags, or manual dispatch with deploy=true.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.deploy == 'true')
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}   # dir on the server holding deploy/ + .env
          IMAGE_API: ${{ env.REGISTRY }}/${{ github.repository }}-api:sha-${{ github.sha }}
          IMAGE_WEB: ${{ env.REGISTRY }}/${{ github.repository }}-web:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Pull the exact images this run built (pinned by commit SHA) and roll the stack.
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<REMOTE
            set -euo pipefail
            cd "$DEPLOY_PATH/deploy"
            export IMAGE_API="$IMAGE_API"
            export IMAGE_WEB="$IMAGE_WEB"
            docker compose pull api web
            docker compose up -d api web proxy
            docker image prune -f
          REMOTE

      - name: Smoke-check /health
        if: success()
        env:
          PUBLIC_URL: ${{ secrets.DEPLOY_PUBLIC_URL }}
        run: |
          set -euo pipefail
          if [ -n "${PUBLIC_URL:-}" ]; then
            for i in $(seq 1 10); do
              code=$(curl -ks -o /dev/null -w '%{http_code}' "$PUBLIC_URL/health" || true)
              echo "attempt $i: $code"
              [ "$code" = "200" ] && exit 0
              sleep 6
            done
            echo "health check did not return 200" >&2; exit 1
          fi
